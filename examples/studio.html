<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelWizardsCharachters · استودیو</title>
<style>
  :root{
    --bg:#0f1220; --panel:#181c30; --panel2:#20263f; --line:#2c3350;
    --ink:#eef1ff; --dim:#98a0c8; --accent:#7c8bff; --accent2:#5fd884;
    --radius:14px; font-family:system-ui,'Segoe UI',Vazirmatn,sans-serif;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#eef1fa;--panel:#fff;--panel2:#f3f5fc;--line:#dfe4f2;--ink:#1a1e35;--dim:#5a6288}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;padding:22px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12.5px;margin:0 0 16px}
  .stage{flex:1 1 320px;min-width:300px;position:relative;background:
    radial-gradient(120% 90% at 50% 0%,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;padding:28px;min-height:360px;overflow:hidden}
  .stage-actor{width:min(340px,70vw);cursor:crosshair}
  .panel{flex:1 1 300px;min-width:280px;max-width:380px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  /* The picker ships with the library (createCharacterPicker) and brings no
     styles of its own, on purpose — these are the host's. Class names are
     ca-picker / ca-picker-item / .is-selected, shared with the React binding. */
  .ca-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px}
  .ca-picker-item{background:var(--panel2);border:1.5px solid var(--line);color:var(--ink);
    border-radius:11px;padding:5px 3px 4px;cursor:pointer;font-family:inherit;display:flex;
    flex-direction:column;align-items:center;gap:1px;transition:border-color .15s,background .15s}
  .ca-picker-item svg{width:100%;height:auto;max-width:52px;display:block}
  .ca-picker-name{font-size:11px;color:var(--dim)}
  .ca-picker-item.is-selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
  .ca-picker-item.is-selected .ca-picker-name{color:var(--ink)}
  .ca-picker-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* transport */
  .transport{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:14px;
    background:var(--panel2)}
  .transport .head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .transport select{flex:1}
  .tbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;
    min-width:34px;height:30px;cursor:pointer;font-family:inherit;font-size:13px}
  .tbtn:disabled{opacity:.4;cursor:not-allowed}
  .tbtn.on{border-color:var(--accent2);color:var(--accent2)}
  .track{display:flex;align-items:center;gap:8px}
  .track input[type=range]{flex:1}
  .phases{display:flex;gap:2px;margin:7px 0 0;height:16px}
  .phases span{flex:1;font-size:9px;color:var(--dim);text-align:center;border-top:1px solid var(--line);
    padding-top:2px;white-space:nowrap;overflow:hidden}
  .phases span.ant{color:#ff9f0a;border-color:#ff9f0a55}
  .phases span.set{color:#64d2ff;border-color:#64d2ff55}
  .note{font-size:11.5px;color:var(--dim);margin:8px 0 0;line-height:1.5}
  .note b{color:var(--ink);font-weight:600}
  .note.warn{color:#ffb86c}
  .note.stop{color:#ff8fa3}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  select,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .val{color:var(--accent2);font-variant-numeric:tabular-nums}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:56px;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:6px;font-size:12px;cursor:pointer;font-family:inherit}
  .seg button.on{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 16%,transparent)}
  /* Wraps: there is one button per gesture and the roster of gestures grows.
     A single non-wrapping row silently pushed the last three off the panel. */
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .actions button{flex:1 1 auto;background:var(--accent);border:2px solid var(--accent);
    color:#0b0e1c;font-weight:600;
    border-radius:9px;padding:7px 9px;cursor:pointer;font-family:inherit;font-size:13px}
  /* Routing, as three looks rather than three opacities — 0.8 against 1.0 is
     not a distinction anyone can see. Hollow + dashed = this character plays it
     with its whole body; grey = it will not play it from here at all. */
  .actions button.fb{background:transparent;border-style:dashed;color:var(--accent)}
  .actions button.no{background:transparent;border-color:var(--line);color:var(--dim);
    cursor:not-allowed;text-decoration:line-through;text-decoration-thickness:1px}
  .speak{display:flex;gap:8px;margin-top:10px}
  .speak button{background:var(--accent2);border:0;color:#062012;font-weight:600;border-radius:9px;padding:0 14px;cursor:pointer}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;
    font-size:11.5px;line-height:1.5;overflow:auto;direction:ltr;text-align:left;color:var(--dim);margin:14px 0 0}
  pre .k{color:var(--accent)} pre .n{color:var(--accent2)} pre .s{color:#ffb86c}
</style>
</head>
<body>
  <div class="stage">
    <div id="host" class="stage-actor"></div>
  </div>

  <div class="panel">
    <h1>🎭 استودیو بازیگر</h1>
    <p class="sub">هر پارامتر یک فیلد از قرارداد <code>ActorFrame</code> است.</p>

    <div id="picker"></div>

    <label>احساس (emotion)</label>
    <select id="emotion"></select>

    <label>شدت (intensity) · <span class="val" id="intensityV">0.70</span></label>
    <input type="range" id="intensity" min="0" max="1" step="0.05" value="0.7">

    <label>ویزیم / دهان (viseme)</label>
    <select id="viseme"></select>

    <label>باز بودن دهان (mouthOpen) · <span class="val" id="mouthOpenV">0.00</span></label>
    <input type="range" id="mouthOpen" min="0" max="1" step="0.05" value="0">

    <label>ابرو (browRaise) · <span class="val" id="browRaiseV">0.00</span></label>
    <input type="range" id="browRaise" min="0" max="1" step="0.05" value="0">

    <label>نگاه (gaze) — یا با اشاره‌گر روی صحنه</label>
    <div class="row">
      <input type="range" id="gazeX" min="-1" max="1" step="0.05" value="0">
      <input type="range" id="gazeY" min="-1" max="1" step="0.05" value="0">
    </div>

    <label>چرخش (yaw) · <span class="val" id="yawV">0.00</span></label>
    <input type="range" id="yaw" min="-1" max="1" step="0.05" value="0">

    <label>حرکت (locomotion)</label>
    <div class="seg" id="loco">
      <button data-v="idle" class="on">ایستاده</button>
      <button data-v="walk">راه‌رفتن</button>
      <button data-v="fly">پرواز</button>
    </div>

    <label>سرعت (speed) · <span class="val" id="speedV">1.0</span></label>
    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">

    <label>جهت (facing)</label>
    <div class="seg" id="facing">
      <button data-v="right" class="on">راست</button>
      <button data-v="left">چپ</button>
    </div>

    <div class="actions" id="actions"></div>

    <div class="transport">
      <div class="head">
        <select id="clip"></select>
        <button class="tbtn" id="play" title="پخش">▶︎</button>
        <button class="tbtn" id="scrubOn" title="حالت فریم‌به‌فریم">⏸</button>
      </div>
      <div class="track">
        <button class="tbtn" id="prev" disabled>◀︎</button>
        <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" disabled>
        <button class="tbtn" id="next" disabled>▶︎</button>
        <span class="val" id="scrubV" style="min-width:5.2em;text-align:left">—</span>
      </div>
      <div class="phases" id="phases"></div>
      <p class="note" id="clipNote"></p>
    </div>

    <label>گفتار (لب‌خوانی فارسی)</label>
    <div class="speak">
      <input type="text" id="say" value="سلام! من روزی هستم">
      <button id="sayBtn">بگو</button>
    </div>

    <pre id="json"></pre>
  </div>

<script type="module">
import {
  ActorRig, CHARACTERS, CHARACTER_SLUGS, EMOTIONS, EMOTION_LABELS, VISEMES, defaultFrame,
  createCharacterPicker, GESTURE_NAMES, frameCount,
} from '../dist/index.js'

const host = document.getElementById('host')
let slug = CHARACTER_SLUGS[0]
// Gesture routing depends on the locomotion the rig is *in*, and locomotion
// arrives on a delay (`interpolate.ts` gives it 60ms) — so asking right after
// `apply()` gets the answer for the state being left, not the one being
// entered. The rig reports each resolved frame; the studio redraws its routing
// when the answer can actually have changed, rather than guessing a timeout.
let ready = false
let shownLoco = null
let rig = new ActorRig(CHARACTERS[slug], {
  size: 340,
  onFrame: (f) => {
    if (!ready || f.locomotion === shownLoco) return
    shownLoco = f.locomotion
    buildClips()
    // A phase pinned while the rig was still leaving the previous locomotion
    // lands on nothing. Re-apply it now that the gait is actually running.
    if (scrubbing) applyScrub()
  },
}).mount(host)
let frame = defaultFrame(slug)

// The picker is the library's own component, not studio code — the same one the
// React binding renders, from the same roster. See src/picker.ts.
createCharacterPicker(document.getElementById('picker'), {
  value: slug,
  onSelect: (s) => {
    slug = s; frame.character = s
    rig.setCharacter(CHARACTERS[s])
    document.getElementById('say').value = `سلام! من ${CHARACTERS[s].name} هستم`
    stopScrub()
    buildClips()
    push()
  },
})

// selects
const emoSel = document.getElementById('emotion')
for (const e of Object.keys(EMOTIONS)) {
  const o = document.createElement('option'); o.value = e; o.textContent = `${EMOTION_LABELS[e]} · ${e}`
  emoSel.appendChild(o)
}
const visSel = document.getElementById('viseme')
for (const v of Object.keys(VISEMES)) {
  const o = document.createElement('option'); o.value = v; o.textContent = `${v} · ${VISEMES[v].label}`
  visSel.appendChild(o)
}

function push(extra) {
  if (extra) frame = { ...frame, ...extra }
  rig.apply(frame)
  renderJSON()
}
function bindRange(id, key, dp=2) {
  const el = document.getElementById(id), out = document.getElementById(id+'V')
  el.oninput = () => { const n = +el.value; if (out) out.textContent = n.toFixed(dp); push({ [key]: n }) }
}
bindRange('intensity','intensity'); bindRange('mouthOpen','mouthOpen')
bindRange('browRaise','browRaise'); bindRange('speed','speed',1)
bindRange('yaw','yaw')
document.getElementById('gazeX').oninput = e => push({ gaze:{ ...frame.gaze, x:+e.target.value } })
document.getElementById('gazeY').oninput = e => push({ gaze:{ ...frame.gaze, y:+e.target.value } })
emoSel.onchange = e => push({ emotion: e.target.value })
visSel.onchange = e => push({ viseme: e.target.value })

const locoBox = document.getElementById('loco')
/** The gaits the studio offers, read off the buttons rather than restated. */
const GAITS = [...locoBox.children].map(b => b.dataset.v).filter(v => v !== 'idle')

function setLoco(v) {
  for (const c of locoBox.children) c.classList.toggle('on', c.dataset.v === v)
  // No buildClips() here on purpose: routing is locomotion-dependent, and the
  // rig is not in the new locomotion yet. The onFrame hook above rebuilds when
  // it arrives.
  push({ locomotion: v })
}
locoBox.onclick = e => { const b = e.target.closest('button'); if (!b) return; stopScrub(); setLoco(b.dataset.v) }

const facingBox = document.getElementById('facing')
facingBox.onclick = e => { const b = e.target.closest('button'); if (!b) return
  [...facingBox.children].forEach(c => c.classList.toggle('on', c === b)); push({ facing: b.dataset.v }) }
// ── gesture buttons: every gesture, with its routing shown ──────────────────
//
// The buttons are generated rather than hand-listed so a new gesture cannot be
// added to the library and quietly missing here. Each one reports how it would
// route for this character *right now* — a whole-body fallback and a refusal
// are both real answers, and a studio that made them look the same would be
// hiding the most interesting behaviour in the library.
const actions = document.getElementById('actions')
function buildActions() {
  actions.innerHTML = ''
  for (const g of GESTURE_NAMES) {
    const plan = rig.planFor(g)
    const b = document.createElement('button')
    b.dataset.g = g
    b.textContent = g
    b.title = plan.mode === 'parts' ? plan.parts.map(p => p.layer).join(' + ')
      : plan.mode === 'fallback' ? `کل بدن — ${plan.reason}`
      : `ممکن نیست — ${plan.reason}`
    if (plan.mode !== 'parts') b.className = plan.mode === 'fallback' ? 'fb' : 'no'
    actions.appendChild(b)
  }
}
actions.onclick = e => {
  const b = e.target.closest('button'); if (!b) return
  stopScrub()
  document.getElementById('clip').value = `g:${b.dataset.g}`
  rig.playGesture(b.dataset.g)
}

// ── transport: play, and step through one clip a frame at a time ────────────
//
// Two different mechanisms sit behind one control, because a gesture and a gait
// are frozen in genuinely different ways — a gesture is a one-shot CSS
// animation held with a negative delay, a gait is either a phase table the rig
// samples per tick or (for unlayered characters) another CSS animation. The rig
// owns both (`scrubGesture`, `pinGaitPhase`); the studio only asks.
//
// Nothing here re-derives a pose. That matters: the whole reason to scrub in a
// browser rather than read `sampleAction` numbers is to see what the *browser's*
// interpolator does, which is the one the user sees.
const clipSel = document.getElementById('clip')
const scrub = document.getElementById('scrub')
const scrubV = document.getElementById('scrubV')
const phases = document.getElementById('phases')
const clipNote = document.getElementById('clipNote')
const btn = { play: document.getElementById('play'), on: document.getElementById('scrubOn'),
  prev: document.getElementById('prev'), next: document.getElementById('next') }

let scrubbing = false

function currentClip() {
  const [kind, name] = clipSel.value.split(':')
  return { kind, name }
}

function buildClips() {
  const keep = clipSel.value
  clipSel.innerHTML = ''
  const add = (v, label) => {
    const o = document.createElement('option'); o.value = v; o.textContent = label
    clipSel.appendChild(o)
  }
  for (const g of GESTURE_NAMES) {
    const plan = rig.planFor(g)
    const tag = plan.mode === 'parts' ? '' : plan.mode === 'fallback' ? ' · کل بدن' : ' · ممکن نیست'
    add(`g:${g}`, `حرکت: ${g}${tag}`)
  }
  for (const gait of GAITS) add(`loco:${gait}`, `چرخه: ${gait}`)
  if ([...clipSel.options].some(o => o.value === keep)) clipSel.value = keep
  buildActions()
  describeClip()
}

/** How many real frames this clip has at 60fps — the step size for ◀︎ / ▶︎. */
function clipFrames() {
  const { kind, name } = currentClip()
  if (kind === 'g') {
    const plan = rig.planFor(name)
    if (plan.mode === 'blocked') return 0
    return frameCount(plan.parts[0].action, 60)
  }
  // A gait cycle is one period; 60fps over the walk period is ~30 frames.
  return 30
}

function describeClip() {
  const { kind, name } = currentClip()
  phases.innerHTML = ''
  if (kind === 'g') {
    const plan = rig.planFor(name)
    if (plan.mode === 'blocked') {
      clipNote.className = 'note stop'
      clipNote.innerHTML = `<b>${name}</b> در این حالت اجرا نمی‌شود (${plan.reason}). این یک ردّ کردن است، نه خطا.`
      return
    }
    const a = plan.parts[0].action
    const ant = (a.anticipation ?? 0.8) > 0 ? (a.antTime ?? 0.18) : 0
    const set = (a.settle ?? 0.8) > 0 ? (a.settleTime ?? 0.26) : 0
    // The phase ribbon under the slider: the derived windows are marked because
    // they are the part of the timeline no keyframe array contains.
    const mark = (cls, w, text) => {
      const s = document.createElement('span')
      s.className = cls; s.style.flex = String(w); s.textContent = text
      phases.appendChild(s)
    }
    if (ant > 0) mark('ant', ant, 'خیز')
    mark('', 1 - ant - set, name)
    if (set > 0) mark('set', set, 'فرود')
    clipNote.className = plan.mode === 'fallback' ? 'note warn' : 'note'
    clipNote.innerHTML = plan.mode === 'fallback'
      ? `<b>کل بدن</b> — ${plan.reason}. ${clipFrames()} فریم در ۶۰fps. نارنجی و آبی، خیز و فرودِ ساخته‌شده‌اند: در هیچ کلید‌فریمی نوشته نشده‌اند.`
      : `${plan.parts.map(p => p.layer).join(' + ')} · ${clipFrames()} فریم در ۶۰fps. نارنجی و آبی، خیز و فرودِ ساخته‌شده‌اند: در هیچ کلید‌فریمی نوشته نشده‌اند.`
    return
  }
  const supported = (CHARACTERS[slug].gaits ?? []).includes(name)
  clipNote.className = supported ? 'note' : 'note warn'
  clipNote.innerHTML = supported
    ? `چرخهٔ ${name} — یک دوره. با نوار، گام‌به‌گام.`
    : `${slug} این گام را ندارد؛ با انیمیشن CSS جایگزین می‌شود. نوار همان را متوقف می‌کند.`
}

function applyScrub() {
  const t = +scrub.value
  const { kind, name } = currentClip()
  const n = clipFrames()
  scrubV.textContent = n ? `${Math.round(t * n)}/${n} · ${(t * 100).toFixed(0)}%` : '—'
  if (kind === 'g') {
    const plan = rig.scrubGesture(name, t)
    if (plan?.mode === 'blocked') scrubV.textContent = '—'
  } else {
    // Scrubbing a cycle means being in it: pinning a phase on an idle rig would
    // freeze a pose the character never adopts.
    if (frame.locomotion !== name) setLoco(name)
    rig.pinGaitPhase(t)
  }
}

function startScrub() {
  scrubbing = true
  btn.on.classList.add('on')
  for (const el of [scrub, btn.prev, btn.next]) el.disabled = false
  applyScrub()
}
function stopScrub() {
  if (!scrubbing) { describeClip(); return }
  scrubbing = false
  btn.on.classList.remove('on')
  for (const el of [scrub, btn.prev, btn.next]) el.disabled = true
  // Release *both* mechanisms: whichever clip is selected, the other one may
  // still be held from a previous scrub.
  for (const g of GESTURE_NAMES) rig.scrubGesture(g, null)
  rig.pinGaitPhase(null)
  scrubV.textContent = '—'
}

btn.on.onclick = () => (scrubbing ? stopScrub() : startScrub())
btn.play.onclick = () => {
  stopScrub()
  const { kind, name } = currentClip()
  if (kind === 'g') rig.playGesture(name)
  else setLoco(name)
}
scrub.oninput = applyScrub
const step = (d) => () => {
  const n = clipFrames() || 1
  scrub.value = Math.min(1, Math.max(0, Math.round(+scrub.value * n) + d) / n)
  applyScrub()
}
btn.prev.onclick = step(-1)
btn.next.onclick = step(1)
clipSel.onchange = () => {
  describeClip()
  if (scrubbing) { stopScrub(); startScrub() }
}
// ← → step the clip, but only when nothing else owns the arrow keys: the
// picker is a radiogroup and arrows are how you move within one.
addEventListener('keydown', e => {
  if (!scrubbing) return
  const t = e.target
  if (t !== scrub && t !== document.body && (t.closest('.ca-picker') || /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))) return
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1)() }
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1)() }
})
document.getElementById('sayBtn').onclick = () => rig.speak(document.getElementById('say').value)

// pointer-follow gaze
host.addEventListener('pointermove', e => {
  const r = host.getBoundingClientRect()
  const gx = Math.max(-1, Math.min(1, (e.clientX - r.left - r.width/2) / (r.width/2)))
  const gy = Math.max(-1, Math.min(1, (e.clientY - r.top - r.height*0.42) / (r.height/2)))
  document.getElementById('gazeX').value = gx.toFixed(2)
  document.getElementById('gazeY').value = gy.toFixed(2)
  push({ gaze:{ x:gx, y:gy } })
})

function renderJSON() {
  const j = JSON.stringify(frame, null, 2)
    .replace(/"([^"]+)":/g, '"<span class="k">$1</span>":')
    .replace(/: (-?\d+\.?\d*)/g, ': <span class="n">$1</span>')
    .replace(/: (".*?")/g, (m,p)=> m.includes('span')?m:`: <span class="s">${p}</span>`)
  document.getElementById('json').innerHTML = j
}
ready = true
shownLoco = frame.locomotion
buildClips()
push()

// The studio's own handles, for poking at from the console — `studio.rig.speak(…)`,
// `studio.frame`. `test/studio.test.mjs` uses `rig.destroy()` to shut the page's
// timers down when it is done booting this file in jsdom.
window.studio = { get rig() { return rig }, get frame() { return frame }, push, buildClips }
</script>
</body>
</html>
